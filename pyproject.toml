[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mot-research"
version = "0.0.0"
description = "Research framework for motion-distribution-aware online multi-object tracking"
requires-python = ">=3.10,<3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
