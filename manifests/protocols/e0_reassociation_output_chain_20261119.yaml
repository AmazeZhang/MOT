    - positive_detection_absent_from_high_pool
    - target_not_finally_updated_by_positive_detection
    - target_updated_by_positive_but_not_emitted
    - target_emitted_but_GT_not_assigned_to_target_ID
    - no_break_reconnect
  category_is_descriptive: true
  secondary_flags: [first_round_positive_pair, OCR_positive_pair, target_updated_by_other_detection, positive_detection_updated_other_track, prior_mature, target_emitted, output_gate_suppressed, GT_assigned_other_ID, GT_no_output_match, first_same_ID_reemit_delay, subsequent_same_ID_loss_or_switch]
  reconcile_known_counts_as_checks: {target_alive: 829, first_round_positive_pair: 575, reconnect_total: 159, first_round_positive_and_reconnect: 158}
  fixed_case_selection: first_2_event_ids_by_SHA256_ASCII_per_category; selected_only_after_full_counts; examples_are_not_denominator
stop_and_trigger:
