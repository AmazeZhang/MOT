  input_detection_rule: score_strictly_greater_than_0.6
  detection_mapping: exact_high_detection_xyxy_score_with_1e-4_tolerance; ambiguous_mapping_fails
  b0_reference_check: frame_and_ID_exact; max_abs_xyxy_error_pixels 0.0001
  state_isolation_check: no_mutation_by_capture_callback
  missing_event_frame: fail
  GT_during_replay: prohibited
label:
