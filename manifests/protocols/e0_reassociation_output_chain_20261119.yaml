  matching: Hungarian_IoU_at_least_0.5_between_all_GT_and_all_emitted_tracker_boxes_per_frame
  reconnect: prior_fixed_B0_ID_is_assigned_to_event_GT_on_after_frame
  persistence: same_ID_assigned_on_after_frame_and_next_4_frames_if_GT_visible; otherwise_censored
  first_break_categories_in_priority_order:
