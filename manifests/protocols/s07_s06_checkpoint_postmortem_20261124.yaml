question: >-
  Do the already-trained S06 Local and Context checkpoints learn action utility
  and action ordering beyond constant predictors on the frozen train18 and
  internal-dev6 labeled samples?
scope:
  kind: CPU-only postmortem of existing artifacts
  allowed:
    - Load all twelve saved Local/Context checkpoints at epochs 5,10,15,20,25,30.
    - Run inference on the already-exported, fixed train18 and internal-dev6 samples.
    - Export per-action labels, predictions, scores, ordering decisions, and aggregate diagnostics.
    - Compare Local and Context only at the same epoch.
    - Add descriptive evidence for already-recorded evaluation8 decisions without rerunning tracking.
  forbidden:
    - Gradient updates, retraining, calibration, threshold scans, or checkpoint reselection.
    - Running seeds 37 or 73.
    - Using evaluation8 to select a model, epoch, threshold, or claim.
    - New TrackEval, closed-loop tracking, FM experiments, or GPU workloads.
known_before_freeze:
  - S06 Context-risk passed 2/8 frozen clauses and remains stopped.
  - Context-no-extra-risk had a single-seed descriptive aggregate gain on reused evaluation8.
  - Local epoch5 and Context epoch30 were selected by the original risk-policy rule.
  - Prior review found sparse supervision, Local M-zero prediction bias in selected cases,
    action-example batching, and unmatched effective capacity.
