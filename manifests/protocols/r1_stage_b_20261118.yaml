sampling:
  candidate_rank: 'SHA256 ASCII lowercase hex of "r1-stage-b-20261118:<sequence>:<frame_6digits>:<component_signature>"; ascending'
  per_frame: one lowest-hash disagreement component; no GT selection
  per_sequence_cap: 600
  global_cap: 20000
  horizon_including_intervention: 10
  sequence_tail: exclude components with fewer than 10 future-inclusive frames; count separately
  action_and_tracker_settings: identical to stage A
  anchor: stage A GT-to-output Hungarian IoU >= 0.5 at t-1; all anchored GT included
  direct_anchor_coverage: count anchors whose original tracker ID is involved in changed component; zero-direct-anchor actions retained and reported separately
  labels:
    future: 10-frame signed identity-correct count delta; harm when any anchor loses correct frames
    immediate: frame-t signed identity-correct count delta; harm when any anchor loses correct frames
    unanchored_gt: excluded from primary label and counted
  audit_archive: first five selected actions by candidate hash per video retain both branches' ten-frame tracker outputs outside Git
features:
  source: tracker/detection/current first-round request and histories through t-1 only; no GT or future data
  names: [component_a0_edges, component_a1_edges, component_tracker_count, component_detection_count, total_tracker_count, total_detection_count, component_mean_detection_score, component_min_detection_score, a0_mean_iou, a1_mean_iou, iou_difference, mean_history_length, mean_observation_gap]
  normalization: training-fit sequences only; zero-variance scales set to 1
learning:
  models: ridge regression for signed delta plus L2 logistic harm classifier; fit separately for future and immediate labels
  ridge_l2: 10.0
  logistic_l2: 10.0
  random_seed: 20261118
  ranking_score: predicted signed delta minus predicted harm probability
  no_hyperparameter_search: true
evaluation:
  type: offline fixed-budget ranking diagnostic on heldout train videos; cannot be deployed as an online threshold
  selection_fraction_per_sequence: 0.25
  selected_count: ceil(0.25 * all sampled candidate actions in each video); identical count for all ranking methods
  methods: [future_linear, immediate_linear, simple_iou_difference, random_20_fixed_seeds, no_intervention, all_intervention]
  random_seed_rule: 'SHA256 ASCII lowercase hex of "r1-stage-b-random:<seed_00_to_19>:<sequence>:<frame_6digits>:<component_signature>"'
  outcome: sum future signed delta and harmed anchor counts on all selected actions; report also direct-anchor subset without using GT to select actions
  per_video: report complete eight-video table; video is pairing unit
  gates_for_considering_stage_c:
    minimum_heldout_videos_with_candidates: 8
    minimum_direct_anchor_actions_total: 80
    future_minus_simple_mean_net_per_selected_action: 0.1
    future_minus_random_mean_net_per_selected_action: 0.1
    future_minus_immediate_mean_net_per_selected_action: 0.1
    minimum_videos_future_beats_simple_net: 6
    minimum_videos_future_beats_immediate_net: 6
    require_future_harmed_anchors_no_more_than_simple: true
  interpretation: exploratory gate; no TrackEval, no natural closed-loop benefit, no independent test claim
budget:
