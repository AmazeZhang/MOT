limitations:
  - This is a one-step common-B0-state diagnostic, not a new natural closed-loop method result.
  - GT identifies the registered positive detection and scores geometry only after inputs and B0 state are fixed.
  - Joined method closed-loop outcomes arose from method-specific histories and therefore provide descriptive, not causal, linkage.
  - Thresholds locate a candidate stage; they do not establish a unique cause or authorize a paper claim.
  - Motion-dev contains selected diagnostic anchors and only 17 gap16-31 events.
