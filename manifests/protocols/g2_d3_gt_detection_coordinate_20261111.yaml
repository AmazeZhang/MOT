protocol_id: g2_d3_gt_detection_coordinate_20261111
status: frozen_before_any_D3_result
frozen_at: 2026-11-11
diagnostic: D3_existing_positive_detection_GT_coordinate
scope:
  dataset: DanceTrack
  split: train
  sequences: [dancetrack0012, dancetrack0020, dancetrack0037, dancetrack0044]
  parent_events: /media/imc/data/mot-data/runs/g2_train_failure_attribution_20261111/all_recovery_events.csv
  parent_events_sha256: 0b775f91746d757f564aacf4cf3d7b0220391c509f6fb9642f77c05c4f07f4fd
  contention_events: /media/imc/data/mot-data/runs/g2_candidate_contention_20261111/event_candidate_contention.csv
  contention_events_sha256: 2861bf06c2ea74cf5dca3d76be879d220e8b7710b84a3df1d80c31eba02ff499
  D2_events: /media/imc/data/mot-data/runs/g2_d2_first_association_v2_20261111/event_d2_first_association.csv
  D2_events_sha256: 8965bbfddff3d3c4ca6c2ec219109278feb365f7b666b751415a5bc62b26ddb1
  included_outcomes: [identity_change_failure, success_control]
  expected_events: 165
  unresolved_parent_events_excluded: 632
  validation_data_used: false
upstream:
  oc_sort_commit: bb2f6867a41082558d95ab47a854a3918de7831b
  detector_cache: ocsort_yolox_dance_bb2f686_b8d1_train
  association_stage: first_round_only
baseline_replay:
  tracker:
    det_thresh: 0.6
    iou_threshold: 0.3
    association: iou_plus_velocity_direction_consistency
    delta_t: 3
    inertia: 0.2
    use_byte: false
    max_age: 30
    min_hits: 3
    empty_frame_policy: upstream_none
  acceptance:
    frame_and_track_ID: exact
    coordinate_representation: original_image_XYXY
    absolute_tolerance: 0.0001
event_mapping:
  evaluation_frame: parent_after_frame
  intended_history_track: parent_before_tracker_id
  positive_detection:
    pool: score_strictly_greater_than_0.6
    mapping: per_frame_GT_detection_one_to_one_Hungarian_max_IoU
    iou_threshold: 0.5
applicable_requirements:
  - positive_detection_exists_in_first_round_pool
  - intended_history_track_is_alive_immediately_before_first_round_association
counterfactual:
  unit: one_event_independently_from_the_same_baseline_frame_state
  privileged_change: replace_only_the_positive_detection_XYXY_with_current_target_GT_XYXY
  unchanged:
    - positive_detection_score_and_candidate_ID
    - detection_pool_count_order_and_all_other_detection_values
    - all_track_predictions_Kalman_states_velocities_and_previous_observations
    - velocity_direction_cost_definition
    - Hungarian_solver_and_thresholds
    - second_round_reassociation
    - baseline_tracker_state_and_lifecycle
  state_writeback: false
  simultaneous_multi_event_oracle: false
association_score:
  definition: raw_OC_SORT_first_round_IoU_plus_velocity_direction_consistency
  no_normalization_or_rescaling: true
  final_pair_acceptance_IoU_at_least: 0.3
  one_to_one_shortcut_adjacency_IoU_strictly_greater_than: 0.3
measurements:
  baseline_positive_match: intended_history_track_matches_positive_detection_in_baseline_first_round
  D3_GT_detection_positive_match: intended_history_track_matches_same_detection_after_coordinate_replacement
  recoverable: baseline_positive_match_false_and_D3_positive_match_true
  harmed: baseline_positive_match_true_and_D3_positive_match_false
  report:
    - original_detection_to_target_GT_IoU
    - detection_XYXY_max_absolute_change
    - intended_track_IoU_and_total_score_before_and_after
    - best_eligible_competitor_score_and_pairwise_margins
    - intended_gate_eligibility_before_and_after
    - one_to_one_shortcut_before_and_after
    - global_pair_set_change
  stratify_by: [parent_outcome, candidate_class, D2_oracle_non_recovery]
claims:
  supported_if_checks_pass:
    - event_level_first_round_headroom_under_privileged_existing_detection_coordinate_correction
  unsupported:
    - detector_recall_improvement_or_added_detection
    - closed_loop_identity_recovery
    - HOTA_AssA_or_IDF1_improvement
    - deployable_detection_refinement
    - causal_observation_error_label
limitations:
  - Current GT detection coordinates are privileged and unavailable at inference.
  - Only an already existing one-to-one positive detection is corrected; missing detections are not added.
  - Correcting one detection changes its score against every live track and can alter global assignment.
  - Counterfactuals are independent and not written back.
  - D1 history and D2 track-position interventions are not combined with D3.
runtime_provenance_required:
  - exact_command_argv
  - Python_executable_version_and_package_versions
  - CUDA_VISIBLE_DEVICES
  - analysis_and_helper_source_hashes
  - upstream_source_hashes_and_commit
  - seqinfo_GT_detection_baseline_parent_and_protocol_hashes
compute:
  environment: mot-det
  device: cpu
  CUDA_VISIBLE_DEVICES: empty
  physical_gpu_0_forbidden: true
