    G: {appearance_weight: 0.0, role: same_state_first_round_candidate}
    V: {appearance_weight: 0.5, role: same_state_first_round_candidate}
  candidate_generation:
    complete_first_round_matches: true
    preserve_fast_path_and_post_LAP_thresholding: true
    no_threshold_sweep: true
    no_GT_in_generation_or_trigger: true
    later_rounds_birth_output_and_memory_follow_executed_M_only: true
  component_definition:
    graph_nodes: detection_row_and_tracker_row_in_union_of_M_G_V_edges
    connected_components: include_all_union_edges_and_unmatched_endpoints_touched_by_a_difference
    action: complete_M_G_or_V_projection_within_one_component
    duplicate_actions_removed: true
    component_outside_matches_unchanged: true
    action_must_be_one_to_one: true
    unit_of_analysis: component_frame
  labels:
    owner_proxy: S02_stable_owner_definition
    applied_after_candidate_generation: true
    future_information: forbidden
    fully_labelable: every_affected_track_has_reliable_owner
    g: number_of_new_correct_pairs_relative_to_M_across_all_labeled_affected_tracks
    h: number_of_M_correct_pairs_destroyed_including_becoming_unmatched
    unlabelable_is_missing_not_zero: true
  coverage_gate:
