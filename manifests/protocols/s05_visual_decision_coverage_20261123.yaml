    exclusive_funnel_priority: [unlabelable, positive_detection_absent, only_low_score_or_later_round, IoU_gate_excluded, no_correct_action_in_M_G_V, recoverable_M_wrong, M_correct_at_risk, other]
    report_intersections: true
    report_counts: [component_frames, unique_frames, unique_videos, unique_track_ids_within_video, labeled_and_unlabeled]

